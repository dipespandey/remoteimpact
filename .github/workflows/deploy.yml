name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      allow_migrations:
        description: 'Apply the production migration plan after reviewing backward compatibility and rollback safety'
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: remoteimpact_test
          POSTGRES_PASSWORD: remoteimpact_test
          POSTGRES_DB: remoteimpact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remoteimpact_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://remoteimpact_test:remoteimpact_test@localhost:5432/remoteimpact_test' || '' }}
      SECRET_KEY: remoteimpact-ci-only-synthetic-key-never-use-in-production-2026
      DEBUG: 'True'
      INDEXNOW_ENABLED: 'False'
      EMAIL_PROVIDER: none
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      # Fixture creation runs the actual local embedding model; prefetch it once
      # so the suite itself can run offline on a fresh CI worker.
      - name: Prepare local embedding model
        env:
          HF_HUB_OFFLINE: '0'
          TRANSFORMERS_OFFLINE: '0'
        run: uv run python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', device='cpu')"
      - name: Test deployment safety
        run: python -m unittest discover -s ops/deploy -p 'test_*.py'
      - name: Smoke test private Redis provisioning and cache database isolation
        if: matrix.database == 'sqlite'
        env:
          RUN_REDIS_DOCKER_SMOKE: '1'
          DJANGO_SETTINGS_MODULE: jobboard.settings
        run: |
          sudo env "PATH=$PATH" DJANGO_SETTINGS_MODULE=jobboard.settings RUN_REDIS_DOCKER_SMOKE=1 "$GITHUB_WORKSPACE/.venv/bin/python" -m unittest discover -s ops/deploy -p 'test_redis_cache_isolation.py'
      - name: Check migrations on a fresh database
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --plan
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --check
      - name: Check schema and run tests
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          # Isolated DB clones per worker; keep both complete database suites.
          # tblib preserves failure tracebacks across worker processes. The
          # pinned test-only overlay does not change the production lock/image.
          uv run --frozen --with tblib==3.2.2 python manage.py test --parallel 2 --noinput
      - name: Check production settings
        env:
          DEBUG: 'False'
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Smoke test production performance logging bootstrap
        env:
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: jobboard.settings
          PERFORMANCE_METRICS_ENABLED: 'True'
          PERFORMANCE_LOG_PATH: ${{ runner.temp }}/performance.jsonl
        run: |
          rm -f "$PERFORMANCE_LOG_PATH" "$PERFORMANCE_LOG_PATH.lock"
          uv run python manage.py check --deploy --fail-level WARNING
          uv run python -c "import django; django.setup(); from jobs.services.performance import emit_event; emit_event({'kind':'bootstrap_smoke','route':'safe/','seconds':0.012})"
          uv run python -c "import json, os, stat; p=os.environ['PERFORMANCE_LOG_PATH']; rows=[json.loads(line) for line in open(p)]; assert rows and rows[-1]['kind']=='bootstrap_smoke'; assert stat.S_IMODE(os.stat(p).st_mode)==0o600"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../static/tailwind.min.css
  deploy:
    needs: checks
    concurrency:
      group: remoteimpact-production
      cancel-in-progress: false
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy checked commit with blue-green cutover
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations == true && 'true' || 'false' }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > /tmp/deploy_known_hosts
          test -s /tmp/deploy_known_hosts
          trap 'rm -f /tmp/deploy_key /tmp/deploy_known_hosts' EXIT
          migration_flag=""
          if [ "$ALLOW_MIGRATIONS" = true ]; then migration_flag=" --allow-migrations"; fi
          ssh -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/deploy_known_hosts -i /tmp/deploy_key "root@$DEPLOY_HOST" "
            cd /opt/easyclaw &&
            git -C repo fetch origin ${{ github.sha }} &&
            /opt/easyclaw/deploy.sh --ref ${{ github.sha }}$migration_flag
          "
