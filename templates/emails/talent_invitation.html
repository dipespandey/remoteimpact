<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#F3F2EE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<div style="max-width:600px;margin:0 auto;padding:40px 20px;">
    <div style="background:white;border-radius:24px;padding:40px;border:1px solid #e5e7eb;">
        <h1 style="font-size:24px;color:#111827;margin:0 0 8px;">You've been invited to apply!</h1>
        <p style="color:#6b7280;margin:0 0 24px;">{{ organization_name }} thinks you'd be great for this role.</p>

        <div style="background:#f9fafb;border-radius:16px;padding:24px;margin-bottom:24px;">
            <h2 style="font-size:20px;color:#111827;margin:0 0 4px;">{{ job_title }}</h2>
            <p style="color:#6b7280;margin:0 0 16px;">at {{ organization_name }}</p>
            {% if message %}
            <div style="border-left:3px solid #6366f1;padding-left:16px;margin-top:16px;">
                <p style="font-size:13px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 4px;">Personal message</p>
                <p style="color:#374151;margin:0;">{{ message }}</p>
            </div>
            {% endif %}
        </div>

        <a href="{{ site_url }}/invitations/" style="display:inline-block;background:#6366f1;color:white;padding:14px 28px;border-radius:50px;text-decoration:none;font-weight:700;font-size:16px;">View Invitation</a>

        <p style="color:#9ca3af;font-size:13px;margin:24px 0 0;">This is a free feature for job seekers on <a href="{{ site_url }}" style="color:#6366f1;">RemoteImpact.org</a></p>
    </div>
</div>
</body>
</html>
