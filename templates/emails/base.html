<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Remote Impact{% endblock %}</title>
  {% block extra_head %}{% endblock %}
</head>
<body style="margin:0;padding:0;background:#f4f5f2;color:#1d211e;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#f4f5f2"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px;background:#ffffff;border:1px solid #e4e8e2"><tr><td style="padding:28px 24px">
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="padding:9px;background:#70ab17;color:#ffffff;font-size:14px;font-weight:bold;line-height:1">RI</td><td style="padding-left:10px;color:#1d211e;font-size:18px;font-weight:bold">Remote Impact</td></tr></table>
{% block content %}{% endblock %}
<div style="margin-top:32px;padding-top:20px;border-top:1px solid #e5e9e4;color:#626a63;font-size:12px;line-height:1.6">{% block footer %}Remote Impact · <a href="https://remoteimpact.org/" style="color:#365426">remoteimpact.org</a>{% endblock %}</div>
</td></tr></table></td></tr></table>
</body></html>
