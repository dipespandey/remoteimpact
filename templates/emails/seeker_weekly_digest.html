<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#F3F2EE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<div style="max-width:600px;margin:0 auto;padding:40px 20px;">
    <div style="background:white;border-radius:24px;padding:40px;border:1px solid #e5e7eb;">
        <h1 style="font-size:24px;color:#111827;margin:0 0 8px;">Your Weekly Impact Update</h1>
        <p style="color:#6b7280;margin:0 0 24px;">Here's what happened with your profile this week.</p>

        <div style="display:flex;gap:16px;margin-bottom:24px;">
            <div style="flex:1;background:#f0fdf4;border-radius:16px;padding:20px;text-align:center;">
                <p style="font-size:36px;font-weight:700;color:#111827;margin:0;">{{ profile_views }}</p>
                <p style="font-size:14px;color:#6b7280;margin:4px 0 0;">Profile Views</p>
            </div>
            <div style="flex:1;background:#eef2ff;border-radius:16px;padding:20px;text-align:center;">
                <p style="font-size:36px;font-weight:700;color:#111827;margin:0;">{{ new_invitations }}</p>
                <p style="font-size:14px;color:#6b7280;margin:4px 0 0;">New Invitations</p>
            </div>
        </div>

        {% if new_invitations > 0 %}
        <a href="{{ site_url }}/invitations/" style="display:inline-block;background:#6366f1;color:white;padding:14px 28px;border-radius:50px;text-decoration:none;font-weight:700;font-size:16px;margin-bottom:16px;">View Invitations</a>
        {% endif %}

        <a href="{{ site_url }}/account/" style="display:inline-block;background:white;color:#374151;padding:14px 28px;border-radius:50px;text-decoration:none;font-weight:600;font-size:16px;border:1px solid #e5e7eb;">Go to Dashboard</a>

        <p style="color:#9ca3af;font-size:13px;margin:24px 0 0;">
            <a href="{{ unsubscribe_url }}" style="color:#9ca3af;">Unsubscribe</a> · <a href="{{ site_url }}" style="color:#6366f1;">RemoteImpact.org</a>
        </p>
    </div>
</div>
</body>
</html>
