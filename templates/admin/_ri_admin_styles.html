{% include "admin/_ri_assets.html" %}
<style>
  :root { color-scheme: only light; --ri-background: hsl(var(--background)); --ri-foreground: hsl(var(--foreground)); --ri-card: hsl(var(--card)); --ri-muted: hsl(var(--muted)); --ri-muted-text: hsl(var(--muted-foreground)); --ri-border: hsl(var(--border)); --ri-ring: hsl(var(--ring)); }
  body {

    --body-bg: var(--ri-background); --body-fg: var(--ri-foreground); --body-quiet-color: var(--ri-muted-text); --body-loud-color: var(--ri-foreground);
    --header-bg: var(--ri-card); --header-color: var(--ri-foreground); --header-branding-color: var(--ri-foreground); --header-link-color: var(--ri-foreground);
    --breadcrumbs-bg: var(--ri-background); --breadcrumbs-fg: var(--ri-muted-text); --breadcrumbs-link-fg: var(--ri-foreground);
    --link-fg: var(--ri-foreground); --link-hover-color: var(--ri-foreground); --link-selected-fg: var(--ri-foreground);
    --hairline-color: var(--ri-border); --border-color: var(--ri-border); --darkened-bg: var(--ri-muted); --selected-bg: var(--ri-muted); --selected-row: var(--ri-muted);

    font-family: Geist, Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.6;

  #header { padding: 16px 24px; border-bottom: 1px solid var(--ri-border); }
  #branding #site-name a { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  #user-tools { text-transform: none; font-size: 14px; line-height: 2; }
  #user-tools a { border: 0; }
  #user-tools a:hover { text-decoration: underline; }

  #nav-filter { padding: 10px; border-radius: 12px; }

  #logout-form button { color: var(--ri-foreground); }
