<div class="mt-4 rounded-xl border border-border/70 bg-muted/40 p-4" data-weekly-inline>
  <div data-prompt-ask>
    <p class="text-sm font-medium">Get roles like this every Thursday</p>
    <p class="mt-0.5 text-xs text-muted-foreground">One free email with hand-picked remote {% if weekly_prompt_topic_label %}{{ weekly_prompt_topic_label|lower }} {% else %}impact {% endif %}jobs.</p>
    <form class="mt-3 space-y-2" data-weekly-form data-source="apply_inline" novalidate>
      <label for="weekly-inline-email" class="sr-only">Email address</label>
      <input id="weekly-inline-email" class="input w-full" aria-describedby="weekly-inline-note weekly-inline-error" type="email" name="email" autocomplete="email" required maxlength="254"
          placeholder="you@example.org" value="{% if user.is_authenticated %}{{ user.email }}{% endif %}">
      <button type="submit" class="btn btn-secondary btn-sm btn-block">Send me weekly picks</button>
    </form>
    <p id="weekly-inline-error" class="mt-1.5 text-xs text-red-600" role="alert" data-prompt-error hidden></p>
    <p id="weekly-inline-note" class="mt-1.5 text-xs text-muted-foreground">We'll send a link to confirm first. Unsubscribe anytime.</p>
  </div>
  <p class="text-sm font-medium" tabindex="-1" data-prompt-done hidden>Check your inbox and open the link to confirm.</p>
</div>
