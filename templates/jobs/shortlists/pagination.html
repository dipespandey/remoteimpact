{% if page_obj.has_other_pages %}<nav class="mt-6 flex items-center justify-between gap-3" aria-label="Pagination">{% if page_obj.has_previous %}<a class="btn btn-outline btn-sm" href="?page={{ page_obj.previous_page_number }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">Previous</a>{% else %}<span></span>{% endif %}<span class="text-[13px] tabular-nums text-muted-foreground">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn btn-outline btn-sm" href="?page={{ page_obj.next_page_number }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">Next</a>{% else %}<span></span>{% endif %}</nav>{% endif %}
