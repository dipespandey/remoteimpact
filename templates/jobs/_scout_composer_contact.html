<div class="mt-4">
  <label for="{{ contact_prefix }}-email" class="label">Email (optional)</label>
  <input id="{{ contact_prefix }}-email" type="email" name="email" autocomplete="email" class="input" placeholder="you@example.org">
  <p class="help">Leave an email if you’d like us to follow up. We’ll send a confirmation link.</p>
  <label class="mt-3 flex items-start gap-2 text-sm leading-5 text-muted-foreground">
    <input type="checkbox" name="contact_consent" class="checkbox mt-1">
    <span>Contact me about this search.</span>
  </label>
  <label class="mt-3 flex items-start gap-2 text-sm leading-5 text-muted-foreground">
    <input type="checkbox" name="marketing_opt_in" class="checkbox mt-1">
    <span>Send me occasional Remote Impact job updates.</span>
  </label>
</div>
