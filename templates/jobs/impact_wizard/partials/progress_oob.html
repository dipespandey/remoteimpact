<!-- Out-of-band progress updates -->
<div id="wizard-progress" hx-swap-oob="true" class="mb-6">
    <div class="mb-2 flex justify-between text-[13px] text-muted-foreground tabular-nums">
        <span id="wizard-step-text">Step {{ step_index|add:1 }} of {{ steps|length }}</span>
        <span id="wizard-percent-text">{{ current_step.progress }}% complete</span>
    </div>
    <div class="h-1 overflow-hidden rounded-full bg-muted" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ current_step.progress }}" aria-label="Profile progress">
        <div id="wizard-progress-bar" class="h-full rounded-full bg-foreground transition-all duration-500"
             style="width: {{ current_step.progress }}%"></div>
    </div>
</div>

<div id="wizard-indicators" hx-swap-oob="true" class="mt-6 flex justify-center" aria-hidden="true">
    <div class="flex items-center gap-1.5">
        {% for step in steps %}
        <div class="h-1.5 w-1.5 rounded-full {% if forloop.counter0 <= step_index %}bg-foreground{% else %}bg-border{% endif %}"></div>
        {% endfor %}
    </div>
</div>
