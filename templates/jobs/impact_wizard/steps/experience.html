<!-- Step 4: Experience Level -->
<div>
    <div class="mb-6">
        <h1 class="text-lg font-semibold tracking-tight text-foreground sm:text-xl">Where are you in your career?</h1>
        <p class="mt-1 text-sm text-muted-foreground">We use this to show roles at the right level.</p>
    </div>

    {% if errors.experience_level %}
    <div class="alert alert-destructive mb-6" role="alert">
        {{ errors.experience_level }}
    </div>
    {% endif %}

    <form hx-post="{% url 'jobs:impact_wizard_step' 'experience' %}"
          hx-target="#wizard-content"
          hx-swap="innerHTML">
        {% csrf_token %}

        <fieldset>
            <legend class="sr-only">Experience level</legend>
            <div class="space-y-2">
                {% for value, label in experience_levels %}
                <label class="relative block cursor-pointer">
                    <input type="radio"
                           name="experience_level"
                           value="{{ value }}"
                           {% if profile.experience_level == value %}checked{% endif %}
                           class="peer sr-only">
                    <span class="block rounded-xl bg-muted px-4 py-3 text-sm font-medium text-foreground transition hover:bg-accent peer-checked:bg-foreground peer-checked:text-background peer-focus-visible:ring-2 peer-focus-visible:ring-ring">
                        {{ label }}
                    </span>
                </label>
                {% endfor %}
            </div>
        </fieldset>

        <div class="mt-8 flex items-center justify-between">
            <a href="{% url 'jobs:impact_wizard_step' 'work-style' %}"
               hx-get="{% url 'jobs:impact_wizard_step' 'work-style' %}"
               hx-target="#wizard-content"
               hx-swap="innerHTML"
               class="btn btn-ghost">
                Back
            </a>
            <button type="submit" class="btn btn-primary">
                Continue
            </button>
        </div>
    </form>
</div>
