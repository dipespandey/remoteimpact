<!-- Step 8: Quick Assessment (Optional) -->
<div>
    <div class="mb-6">
        <h1 class="text-lg font-semibold tracking-tight text-foreground sm:text-xl">Three optional questions</h1>
        <p class="mt-1 text-sm text-muted-foreground">Your answers help us rank jobs by fit. You can skip this step.</p>
    </div>

    <form hx-post="{% url 'jobs:impact_wizard_step' 'assessment' %}"
          hx-target="#wizard-content"
          hx-swap="innerHTML"
          class="space-y-4">
        {% csrf_token %}

        <!-- Question 1: Time Horizon -->
        <fieldset class="rounded-2xl bg-muted p-5">
            <legend class="px-1 text-sm font-semibold text-foreground">What type of impact appeals more to you?</legend>
            <div class="mt-2 space-y-2.5">
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="time_horizon" value="future"
                           {% if profile.assessment_answers.time_horizon == 'future' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">Preventing future catastrophes (long-term thinking)</span>
                </label>
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="time_horizon" value="present"
                           {% if profile.assessment_answers.time_horizon == 'present' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">Helping people suffering today (immediate impact)</span>
                </label>
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="time_horizon" value="both"
                           {% if profile.assessment_answers.time_horizon == 'both' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">Both equally</span>
                </label>
            </div>
        </fieldset>

        <!-- Question 2: Org Size -->
        <fieldset class="rounded-2xl bg-muted p-5">
            <legend class="px-1 text-sm font-semibold text-foreground">What type of organization do you prefer?</legend>
            <div class="mt-2 space-y-2.5">
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="org_size" value="startup"
                           {% if profile.assessment_answers.org_size == 'startup' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">Small, scrappy startup (move fast, wear many hats)</span>
                </label>
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="org_size" value="established"
                           {% if profile.assessment_answers.org_size == 'established' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">Large, established organization (stability, resources)</span>
                </label>
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="org_size" value="either"
                           {% if profile.assessment_answers.org_size == 'either' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">Either is fine</span>
                </label>
            </div>
        </fieldset>

        <!-- Question 3: Risk Tolerance -->
        <fieldset class="rounded-2xl bg-muted p-5">
            <legend class="px-1 text-sm font-semibold text-foreground">How do you feel about career risk?</legend>
            <div class="mt-2 space-y-2.5">
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="risk_tolerance" value="high"
                           {% if profile.assessment_answers.risk_tolerance == 'high' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">I'm willing to take risks for potentially higher impact</span>
                </label>
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="risk_tolerance" value="moderate"
                           {% if profile.assessment_answers.risk_tolerance == 'moderate' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">I prefer a balance of risk and stability</span>
                </label>
                <label class="flex cursor-pointer items-center gap-3 text-sm">
                    <input type="radio" name="risk_tolerance" value="low"
                           {% if profile.assessment_answers.risk_tolerance == 'low' %}checked{% endif %}
                           class="h-4 w-4 border-input text-foreground focus:ring-ring">
                    <span class="text-foreground">I prefer stable, lower-risk opportunities</span>
                </label>
            </div>
        </fieldset>

        <div class="flex items-center justify-between pt-2">
            <a href="{% url 'jobs:impact_wizard_step' 'story' %}"
               hx-get="{% url 'jobs:impact_wizard_step' 'story' %}"
               hx-target="#wizard-content"
               hx-swap="innerHTML"
               class="btn btn-ghost">
                Back
            </a>
            <div class="flex items-center gap-2">
                <button type="button"
                        hx-post="{% url 'jobs:impact_wizard_skip' 'assessment' %}"
                        hx-target="#wizard-content"
                        hx-swap="innerHTML"
                        class="btn btn-ghost">
                    Skip
                </button>
                <button type="submit" class="btn btn-primary">
                    Continue
                </button>
            </div>
        </div>
    </form>
</div>
