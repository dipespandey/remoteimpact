
{% load csp %}
<!-- Step 2: Impact Areas -->
<div>
    <div class="mb-6">
        <h1 class="text-lg font-semibold tracking-tight text-foreground sm:text-xl">Which causes do you want to work on?</h1>
        <p class="mt-1 text-sm text-muted-foreground">Pick up to 5.</p>
    </div>

    {% if errors.impact_areas %}
    <div class="alert alert-destructive mb-6" role="alert">
        {{ errors.impact_areas }}
    </div>
    {% endif %}

    <form hx-post="{% url 'jobs:impact_wizard_step' 'impact-areas' %}"
          hx-target="#wizard-content"
          hx-swap="innerHTML"
          id="impact-form">
        {% csrf_token %}

        <fieldset>
            <legend class="sr-only">Impact areas</legend>
            <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 md:grid-cols-3">
                {% for category in categories %}
                <label class="relative cursor-pointer">
                    <input type="checkbox"
                           name="impact_areas"
                           value="{{ category.id }}"
                           {% if category.id in selected_areas %}checked{% endif %}
                           class="peer sr-only impact-checkbox"
                           {% csp_handler "onchange" %}updateSelectionCount(){% endcsp_handler %}>
                    <span class="flex h-full items-center rounded-xl bg-muted px-4 py-3 text-sm font-medium text-foreground transition hover:bg-accent peer-checked:bg-foreground peer-checked:text-background peer-focus-visible:ring-2 peer-focus-visible:ring-ring">
                        {{ category.name }}
                    </span>
                </label>
                {% endfor %}
            </div>
        </fieldset>

        <p class="mt-4 text-sm text-muted-foreground tabular-nums" aria-live="polite">
            <span id="selection-count">{{ selected_areas|length }}</span> of 5 selected
        </p>

        <div class="mt-8 flex items-center justify-between">
            <a href="{% url 'jobs:impact_wizard_step' 'welcome' %}"
               hx-get="{% url 'jobs:impact_wizard_step' 'welcome' %}"
               hx-target="#wizard-content"
               hx-swap="innerHTML"
               class="btn btn-ghost">
                Back
            </a>
            <button type="submit" class="btn btn-primary">
                Continue
            </button>
        </div>
    </form>
</div>

{% csp_script %}<script>
function updateSelectionCount() {
    const checked = document.querySelectorAll('.impact-checkbox:checked').length;
    document.getElementById('selection-count').textContent = checked;
}
</script>{% endcsp_script %}
