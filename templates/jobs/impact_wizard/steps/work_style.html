<!-- Step 3: Work Style -->
<div>
    <div class="mb-6">
        <h1 class="text-lg font-semibold tracking-tight text-foreground sm:text-xl">What kind of work do you do?</h1>
        <p class="mt-1 text-sm text-muted-foreground">Select all that apply.</p>
    </div>

    {% if errors.work_style %}
    <div class="alert alert-destructive mb-6" role="alert">
        {{ errors.work_style }}
    </div>
    {% endif %}

    <form hx-post="{% url 'jobs:impact_wizard_step' 'work-style' %}"
          hx-target="#wizard-content"
          hx-swap="innerHTML">
        {% csrf_token %}

        <fieldset>
            <legend class="sr-only">Work styles</legend>
            <div class="space-y-2">
                {% for value, label in work_styles %}
                <label class="relative block cursor-pointer">
                    <input type="checkbox"
                           name="work_styles"
                           value="{{ value }}"
                           {% if value in profile.work_styles %}checked{% endif %}
                           class="peer sr-only">
                    <span class="block rounded-xl bg-muted px-4 py-3 text-sm font-medium text-foreground transition hover:bg-accent peer-checked:bg-foreground peer-checked:text-background peer-focus-visible:ring-2 peer-focus-visible:ring-ring">
                        {{ label }}
                    </span>
                </label>
                {% endfor %}
            </div>
        </fieldset>

        <div class="mt-8 flex items-center justify-between">
            <a href="{% url 'jobs:impact_wizard_step' 'impact-areas' %}"
               hx-get="{% url 'jobs:impact_wizard_step' 'impact-areas' %}"
               hx-target="#wizard-content"
               hx-swap="innerHTML"
               class="btn btn-ghost">
                Back
            </a>
            <button type="submit" class="btn btn-primary">
                Continue
            </button>
        </div>
    </form>
</div>
