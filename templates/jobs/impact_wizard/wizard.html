{% extends "base.html" %}

{% block title %}Build Your Impact Profile - Remote Impact{% endblock %}

{% block content %}
<div class="page-narrow">

    <!-- Progress -->
    <div id="wizard-progress" class="mb-6">
        <div class="mb-2 flex justify-between text-xs text-muted-foreground tabular-nums">
            <span id="wizard-step-text">Step {{ step_index|add:1 }} of {{ steps|length }}</span>
            <span id="wizard-percent-text">{{ current_step.progress }}% complete</span>
        </div>
        <div class="h-1 overflow-hidden rounded-full bg-muted" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ current_step.progress }}" aria-label="Profile progress">
            <div id="wizard-progress-bar" class="h-full rounded-full bg-foreground transition-all duration-500"
                 style="width: {{ current_step.progress }}%"></div>
        </div>
    </div>

    <!-- Step content -->
    <div id="wizard-content"
         hx-get="{% url 'jobs:impact_wizard_step' current_step.slug %}"
         hx-trigger="load"
         hx-swap="innerHTML show:window:top"
         class="card p-5 sm:p-7">
        <!-- Step content loaded here via HTMX -->
        <div class="flex items-center justify-center py-12" role="status">
            <div class="h-6 w-6 animate-spin rounded-full border-2 border-border border-t-foreground" aria-hidden="true"></div>
            <span class="sr-only">Loading</span>
        </div>
    </div>

    <!-- Step indicators -->
    <div id="wizard-indicators" class="mt-6 flex justify-center" aria-hidden="true">
        <div class="flex items-center gap-1.5">
            {% for step in steps %}
            <div class="h-1.5 w-1.5 rounded-full {% if forloop.counter0 <= step_index %}bg-foreground{% else %}bg-border{% endif %}"></div>
            {% endfor %}
        </div>
    </div>

</div>

<script>
document.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'wizard-content') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
});
</script>
{% endblock %}
