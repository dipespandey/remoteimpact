{# Prose enhancements: reusable blocks for text-heavy pages (v3: calm, neutral).
   Include in any template: {% include 'components/prose_enhancements.html' %}
   Class names are kept stable because stored article HTML may use them. #}

<style>
/* Callouts: tinted fill, no border */
.callout {
    position: relative;
    padding: 1rem 1.25rem;
    border-radius: 0.75rem;
    margin: 1.5rem 0;
    background: hsl(var(--muted));
    color: hsl(var(--foreground));
}
.callout::before { content: none; }
.callout-info { background: hsl(var(--muted)); }
.callout-tip { background: #ecfdf5; color: #064e3b; }
.callout-warning { background: #fffbeb; color: #78350f; }
.callout-quote { background: hsl(var(--muted)); font-style: italic; }

/* Key stats row */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    margin: 2rem 0;
}
.stat-card {
    background: hsl(var(--muted));
    border-radius: 1rem;
    padding: 1rem;
}
.stat-number {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.012em;
    font-variant-numeric: tabular-nums;
    color: hsl(var(--foreground));
    line-height: 1.2;
}
.stat-card .stat-label {
    font-size: 0.8125rem;
    color: hsl(var(--muted-foreground));
    margin-top: 0.25rem;
}

/* Icon lists: quiet dots, no glyphs */
.icon-list {
    list-style: none !important;
    padding-left: 0 !important;
    margin: 1.5rem 0;
}
.icon-list li {
    position: relative;
    padding-left: 1.5rem;
    margin-bottom: 0.5rem;
}
.icon-list li::before {
    content: '';
    position: absolute;
    left: 0.25rem;
    top: 0.65em;
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 9999px;
    background: hsl(var(--foreground) / 0.4);
}

/* Feature cards */
.feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 0.75rem;
    margin: 2rem 0;
}
.feature-card {
    background: hsl(var(--card));
    border-radius: 1rem;
    padding: 1.25rem;
    box-shadow: 0 0 0 1px rgb(20 20 25 / 0.04), 0 1px 2px rgb(20 20 25 / 0.04), 0 2px 8px -2px rgb(20 20 25 / 0.05);
    transition: background-color 0.15s ease;
}
.feature-card:hover { background: hsl(var(--muted) / 0.6); }
.feature-card-icon { display: none; }
.feature-card h3, .feature-card h4 {
    font-size: 1rem;
    font-weight: 600;
    color: hsl(var(--foreground));
    margin: 0 0 0.375rem 0;
}
.feature-card p {
    font-size: 0.875rem;
    color: hsl(var(--muted-foreground));
    margin: 0;
    line-height: 1.55;
}
.feature-card-link {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    color: hsl(var(--foreground));
    font-weight: 500;
    font-size: 0.875rem;
    margin-top: 0.75rem;
    text-decoration: underline;
    text-decoration-color: hsl(var(--border));
    text-underline-offset: 4px;
}
.feature-card-link:hover { text-decoration-color: hsl(var(--foreground)); }

/* Organization cards */
.org-card {
    background: hsl(var(--muted));
    border-radius: 1rem;
    padding: 1.25rem;
    margin: 1.5rem 0;
    display: flex;
    gap: 1rem;
    align-items: flex-start;
}
.org-card-badge {
    flex-shrink: 0;
    width: 2.75rem;
    height: 2.75rem;
    background: hsl(var(--card));
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 600;
    color: hsl(var(--muted-foreground));
}
.org-card-content h3, .org-card-content h4 {
    font-size: 1rem;
    font-weight: 600;
    color: hsl(var(--foreground));
    margin: 0 0 0.375rem 0;
}
.org-card-content p {
    font-size: 0.9375rem;
    color: hsl(var(--muted-foreground));
    margin: 0;
    line-height: 1.6;
}
.org-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
    margin-top: 0.75rem;
}
.org-tag {
    font-size: 0.75rem;
    padding: 0.125rem 0.5rem;
    background: hsl(var(--card));
    color: hsl(var(--foreground));
    border-radius: 9999px;
}

/* Key takeaways */
.tldr-box {
    background: hsl(var(--muted));
    border-radius: 1rem;
    padding: 1.25rem 1.5rem;
    margin: 2rem 0;
}
.tldr-box h3, .tldr-box h4 {
    font-size: 0.9375rem;
    font-weight: 600;
    color: hsl(var(--foreground));
    margin: 0 0 0.75rem 0;
}
.tldr-box ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
.tldr-box li {
    position: relative;
    padding-left: 1.25rem;
    margin-bottom: 0.375rem;
    color: hsl(var(--foreground));
}
.tldr-box li::before {
    content: '';
    position: absolute;
    left: 0.25rem;
    top: 0.65em;
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 9999px;
    background: hsl(var(--foreground) / 0.4);
}

/* Table of contents */
.toc-box {
    background: hsl(var(--muted));
    border-radius: 1rem;
    padding: 1.125rem 1.25rem;
    margin: 2rem 0;
}
.toc-box h4 {
    font-size: 0.8125rem;
    font-weight: 500;
    color: hsl(var(--muted-foreground));
    margin: 0 0 0.5rem 0;
}
.toc-box ol {
    list-style: decimal;
    padding-left: 1.25rem;
    margin: 0;
}
.toc-box li { margin-bottom: 0.25rem; }
.toc-box a {
    color: hsl(var(--foreground));
    text-decoration: none;
    font-size: 0.9rem;
}
.toc-box a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Section break: whitespace and a muted label, no rules */
.section-divider {
    margin: 2.5rem 0 1rem;
    color: hsl(var(--muted-foreground));
    font-size: 0.8125rem;
    font-weight: 500;
}
.section-divider::before,
.section-divider::after { content: none; }

/* Numbered sections (multi-step guides only) */
.numbered-section { counter-reset: section-counter; }
.numbered-item {
    position: relative;
    padding-left: 2.5rem;
    margin-bottom: 1.75rem;
}
.numbered-item::before {
    counter-increment: section-counter;
    content: counter(section-counter);
    position: absolute;
    left: 0;
    top: 0.1rem;
    width: 1.625rem;
    height: 1.625rem;
    background: hsl(var(--muted));
    color: hsl(var(--foreground));
    font-weight: 500;
    font-size: 0.8125rem;
    font-variant-numeric: tabular-nums;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Quote block */
.quote-block {
    position: relative;
    background: hsl(var(--muted));
    border-radius: 1rem;
    padding: 1.25rem 1.5rem;
    margin: 2rem 0;
}
.quote-block p {
    font-size: 1.0625rem;
    color: hsl(var(--foreground));
    margin: 0;
    line-height: 1.7;
}
.quote-block cite {
    display: block;
    margin-top: 0.75rem;
    font-size: 0.875rem;
    font-style: normal;
    color: hsl(var(--muted-foreground));
}
.quote-block cite::before { content: '— '; }

/* Reading progress bar (blog) */
.reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 2px;
    background: hsl(var(--foreground));
    z-index: 9999;
    transition: width 0.1s ease;
}

/* Read time */
.read-time {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    font-size: 0.8125rem;
    color: hsl(var(--muted-foreground));
    background: hsl(var(--muted));
    padding: 0.125rem 0.625rem;
    border-radius: 9999px;
}
.read-time svg { width: 0.875rem; height: 0.875rem; }

@media (max-width: 640px) {
    .org-card { flex-direction: column; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .feature-grid { grid-template-columns: 1fr; }
}
</style>
