{% extends "base.html" %}
{% load form_tags %}

{% block title %}Sign in via {{ provider.name }} - Remote Impact{% endblock %}

{% block content %}
<section class="px-4 py-10 sm:py-16">
    <div class="card mx-auto w-full max-w-sm">
        <div class="card-header">
            <h1 class="text-xl font-semibold tracking-tight text-foreground">Confirm {{ provider.name }} sign in</h1>
            <p class="card-description">You are about to sign in using your {{ provider.name }} account.</p>
        </div>
        <div class="card-content">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    Continue with {{ provider.name }}
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
