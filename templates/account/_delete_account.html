    <section class="card p-5 sm:p-6">
        <div class="grid gap-6 lg:grid-cols-[1fr_380px] lg:items-start">
            <div>
                <p class="text-xs font-medium text-destructive">Danger zone</p>
                <h2 class="section-title mt-1">Delete your account</h2>
                <p class="mt-1.5 text-sm leading-6 text-muted-foreground">
                    This permanently deletes your account, profile, saved jobs, applications, job alerts, invitations,
                    assistant usage, and other records connected to your user. Employer organizations created only by
                    you will also be removed.
                </p>
            </div>
            <form method="post" action="{% url 'jobs:account_delete' %}" class="space-y-3"
                  onsubmit="return confirm('This permanently deletes your account and related data. Continue?')">
                {% csrf_token %}
                <label for="delete-account-confirmation" class="label break-words">
                    Type <span class="font-mono text-destructive">{{ delete_account_identifier }}</span> to confirm
                </label>
                <input id="delete-account-confirmation" name="confirmation" type="text" autocomplete="off"
                       class="input"
                       placeholder="{{ delete_account_identifier }}">
                <button type="submit" class="btn btn-destructive btn-block">Delete my account</button>
            </form>
        </div>
    </section>
