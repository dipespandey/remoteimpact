{% if already_resonated %}
<button type="button" disabled
    class="inline-flex cursor-not-allowed items-center gap-1.5 rounded-full bg-accent px-3 py-1.5 text-[13px] text-foreground">
    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z"/></svg>
    <span class="tabular-nums">{{ story.resonate_count }}</span>
    <span>resonated</span>
</button>
{% else %}
<button type="button" hx-post="{% url 'jobs:resonate' story.id %}" hx-target="#modal-content" hx-swap="innerHTML"
    class="inline-flex items-center gap-1.5 rounded-full bg-muted px-3 py-1.5 text-[13px] text-muted-foreground transition-colors hover:bg-accent hover:text-foreground">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg>
    <span class="tabular-nums">{{ story.resonate_count }}</span>
    <span>resonates</span>
</button>
{% endif %}
