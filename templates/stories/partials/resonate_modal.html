<div class="p-6">
    <h2 class="section-title">What resonated with you?</h2>
    <p class="mt-1 text-sm text-muted-foreground">Your answer helps us show you stories and roles closer to what you care about.</p>

    <form class="mt-5" hx-post="{% url 'jobs:save_resonance' story.id %}"
          hx-target="#resonate-{{ story.id }}"
          hx-swap="innerHTML"
          hx-on="htmx:afterSwap: document.getElementById('modal-container').classList.add('hidden')">
        {% csrf_token %}
        <fieldset class="space-y-2">
            <legend class="sr-only">What resonated</legend>
            {% for value, label in resonance_choices %}
            <label class="flex cursor-pointer items-center gap-3 rounded-xl bg-muted p-3 text-sm font-medium text-foreground transition-colors hover:bg-accent has-[:checked]:bg-accent has-[:checked]:ring-2 has-[:checked]:ring-ring/30">
                <input type="radio" name="resonance_type" value="{{ value }}" class="h-4 w-4 border-input text-foreground focus:ring-ring" {% if forloop.first %}checked{% endif %}>
                {{ label }}
            </label>
            {% endfor %}
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block mt-5">Save</button>
    </form>
</div>
