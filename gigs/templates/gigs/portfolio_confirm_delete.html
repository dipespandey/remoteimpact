{% extends "base.html" %}

{% block title %}Delete Portfolio Item{% endblock %}

{% block content %}
<section class="page-narrow">
    <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-xs text-muted-foreground">
        <a href="{% url 'gigs:portfolio_list' %}" class="hover:text-foreground">Portfolio</a>
        <span aria-hidden="true">/</span>
        <span class="text-foreground">Delete</span>
    </nav>

    <div class="card mt-6">
        <div class="card-header">
            <h1 class="text-lg font-semibold tracking-tight text-foreground">Delete "{{ object.title }}"?</h1>
            <p class="card-description">This removes the item from your portfolio and cannot be undone.</p>
        </div>
        <div class="card-content">
            <form method="post" class="flex gap-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-destructive">Delete item</button>
                <a href="{% url 'gigs:portfolio_list' %}" class="btn btn-outline">Cancel</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
