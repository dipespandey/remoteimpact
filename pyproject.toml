[project]
name = "remoteimpact"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "playwright>=1.49.0",
    "django>=5.2.17,<5.3",
    "django-allauth[mfa]>=65.20.1,<66",
    "django-extensions>=4.1",
    "django-countries>=7.6",
    "pyjwt>=2.15.0,<3",
    "cryptography>=50.0.0,<51",
    "openai>=2.8.1",
    "pillow>=13.0.0,<14",
    "requests>=2.33.0,<3",
    "urllib3>=2.8.0,<3",
    "transformers>=5.10.0,<6",
    "airtable-scraper>=0.0.3",
    "stripe>=11.0.0",
    "ipython>=9.8.0",
    "googlesearch-python>=1.2.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.10.0",
    "python-dotenv>=1.2.2,<2",
    "gunicorn>=23.0.0",
    "whitenoise>=6.11.0",
    "psycopg2-binary>=2.9.11",
    "resend>=2.19.0",
    "dj-database-url>=3.1.0",
    "psycopg[binary]>=3.3.2",
    "sentence-transformers>=5.6.0,<6",
    "pgvector>=0.4.2",
    "torch>=2.13.0,<3",
    "markdown>=3.5",
    "redis>=5.0.0,<5.2.0",
    "pypdf>=6.21.2,<7",
    "python-docx>=1.1",
]

[tool.uv]
# Force CPU-only PyTorch to reduce Docker image size (~100MB vs ~2GB)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
